<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q3 - Event delegation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>To-do list</h1>
    <p>Click any item to mark it done. New items (even the ones you add below) work too.</p>

    <ul id="todo-list">
      <li>Buy groceries</li>
      <li>Walk the dog</li>
      <li>Finish assignment</li>
    </ul>

    <input type="text" id="new-item-text" placeholder="New item..." />
    <button id="add-item-button">Add item</button>

    <script src="script.js"></script>
  </body>
</html>
